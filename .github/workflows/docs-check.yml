name: Docs check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: docs.json parses
        run: node -e "JSON.parse(require('fs').readFileSync('docs.json', 'utf8'))"

      - name: Frontmatter and pt-BR twins
        run: node scripts/check-frontmatter.mjs

      - name: Broken links
        run: npx --yes mint@latest broken-links

      - name: MDX builds
        run: npx --yes mint@latest validate
